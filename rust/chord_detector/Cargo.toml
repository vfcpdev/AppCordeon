[package]
name = "chord_detector"
version = "0.1.0"
edition = "2021"
description = "Motor de detección espectral de acordes, tonalidad y BPM para Acordeón Diatónico Pro compilado a WebAssembly"
authors = ["Antigravity Pair Programmer"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
