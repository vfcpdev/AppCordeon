[package]
name = "acordeon_engine"
version = "0.1.0"
edition = "2021"
description = "Motor de síntesis DSP, teoría armónica y análisis espectral en Rust para Acordeón Diatónico Pro"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
